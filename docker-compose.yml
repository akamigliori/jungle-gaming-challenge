# Definição compartilhada das instâncias da aplicação (profile `app`).
x-app: &app
  profiles: [app]
  image: wagering-app
  init: true
  mem_limit: 256m
  # Precisa cobrir SHUTDOWN_TIMEOUT_MS + 5 s, a saída forçada do main.ts (25 s com os valores padrão)
  stop_grace_period: 30s
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    SQS_ENDPOINT: http://localstack:4566
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.4.0
    mem_limit: 512m
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Saudável só depois que os scripts de ready.d (criação das filas) terminaram sem erro.
      test:
        - CMD-SHELL
        - >-
          r=$$(curl -sf http://localhost:4566/_localstack/init/ready)
          && echo "$$r" | grep -q '"completed": true'
          && ! echo "$$r" | grep -q '"state": "ERROR"'
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica as migrations uma vez e termina; as instâncias só sobem depois dele.
  migrate:
    profiles: [app]
    build: .
    image: wagering-app
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    ports:
      - "3003:3000"

  # IdP para a autenticação (profile `auth`, sobe só quando necessário). Heap limitado para a
  # máquina de 8 GB; não sobe junto com as três instâncias nem com o teste de carga.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0.7
    mem_limit: 512m
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      JAVA_OPTS_APPEND: -Xmx256m
    command: start-dev --import-realm --http-port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /realms/wagering HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q 200'
      interval: 5s
      timeout: 5s
      retries: 20

  # Observabilidade (profile `observability`, opt-in): o Prometheus coleta `/metrics` das três
  # instâncias e avalia os alertas; o Grafana sobe com o dashboard provisionado. Não há
  # Alertmanager: as regras aparecem disparando no Prometheus e no Grafana.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.2
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test:
        ["CMD-SHELL", 'wget -qO- http://localhost:3000/api/health | grep -qi ''"database": *"ok"''']
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
