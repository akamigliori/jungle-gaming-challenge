global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# As três instâncias publicam `/metrics` na porta interna 3000 (`app-1`, `app-2`, `app-3`).
# Se o profile `app` não estiver no ar, os alvos aparecem como down e o Prometheus segue.
scrape_configs:
  - job_name: wagering
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-1:3000
          - app-2:3000
          - app-3:3000
